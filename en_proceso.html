<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sitio en proceso</title>
	<style>
/* Adaptación para celulares */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 10px;
    width: 100%;
    overflow-x: hidden;
}

/* Imágenes */
img {
    max-width: 100%;
    height: auto;
}

/* Videos */
video {
    max-width: 100%;
    height: auto;
}

/* Botones */
button, a {
    max-width: 100%;
}

/* Cuadros y contenido */
.contenedor {
    width: 100%;
    max-width: 100%;
    margin: auto;
}

/* Para celulares */
@media (max-width: 600px) {

    body {
        font-size: 16px;
    }

    h1 {
        font-size: 28px;
    }

    h2 {
        font-size: 23px;
    }

    p {
        font-size: 16px;
    }

    .boton {
        width: 100%;
        margin: 5px 0;
    }

    .contenedor {
        width: 100%;
        padding: 10px;
    }
}
</style>
</head>
<body>

</body>
</html>
